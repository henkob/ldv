<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who is Who in the Zoo? – prototyp</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#eef4fc;color:#142b60}*{box-sizing:border-box}body{margin:0;padding:20px 12px}.app{max-width:440px;margin:auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #152e5b24}.head{background:#142b60;color:white;padding:20px;text-align:center}.head h1{font-size:21px;margin:0 0 6px}.head small{color:#f4d34d}.content{padding:20px;text-align:center}.portrait{width:min(58vw,230px);height:min(58vw,230px);max-width:230px;max-height:230px;margin:12px auto 20px;border:5px solid #f4d34d;border-radius:50%;overflow:hidden;background:#d9e7f8;display:grid;place-items:center;will-change:transform;transition:width .25s,height .25s}.portrait img{width:100%;height:100%;object-fit:cover}.portrait svg{width:65%;fill:#7693bc}.app:focus-within .portrait{width:min(40vw,155px);height:min(40vw,155px)}.portrait.jump{animation:jump .65s ease-in-out}.portrait.sway{animation:sway 1.3s ease-in-out}@keyframes jump{0%,100%{transform:translateY(0)}15%{transform:translateY(-17px)}30%{transform:translateY(0)}45%{transform:translateY(-11px)}60%{transform:translateY(0)}75%{transform:translateY(-5px)}}@keyframes sway{0%,100%{transform:translateX(0)}15%{transform:translateX(-13px)}35%{transform:translateX(13px)}55%{transform:translateX(-10px)}75%{transform:translateX(8px)}90%{transform:translateX(-3px)}}button{background:#f4d34d;color:#142b60;border:0;border-radius:12px;font-weight:800;font-size:16px;padding:14px 18px;cursor:pointer;width:100%;margin-top:12px}button:focus-visible,input:focus-visible{outline:3px solid #1b69d2;outline-offset:3px}input{width:100%;padding:15px;border:2px solid #bdcce0;border-radius:12px;font-size:18px}input:focus{border-color:#284a8c}.name{font-size:36px;font-weight:850;min-height:52px;letter-spacing:.03em}.result{font-size:23px;font-weight:800;min-height:30px}.result.ok{color:#168345}.sub{color:#61718b;font-size:14px}.hidden{display:none!important}.stage{position:relative;isolation:isolate}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}.confetti i{position:absolute;top:35%;left:50%;width:8px;height:13px;animation:burst 1.5s ease-out forwards}@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}.progress{font-size:13px;color:#62738c}.note{font-size:12px;color:#62738c;margin-top:18px;line-height:1.5}@media(max-height:680px){.portrait{width:160px;height:160px}.app:focus-within .portrait{width:115px;height:115px}}@media(prefers-reduced-motion:reduce){.portrait,.portrait.jump,.portrait.sway,.confetti i{animation:none!important;transition:none!important}}
</style></head><body><main class="app"><header class="head"><h1>Who is Who in the Zoo?</h1><small>Interaktiv designprototyp</small></header><div class="content"><div class="progress">Fråga 1 av 1</div><div class="stage"><div class="confetti" id="confetti"></div><div class="portrait" id="portrait"><svg viewBox="0 0 100 100" role="img" aria-label="Exempelporträtt"><circle cx="50" cy="32" r="20"/><path d="M9 100c0-28 17-44 41-44s41 16 41 44z"/></svg></div><div class="sub" id="prompt">Vem är det här?</div><div class="name hidden" id="name"></div><div class="result hidden" id="result" aria-live="polite"></div></div><form id="form"><input id="answer" placeholder="Skriv förnamn..." autocomplete="off" aria-label="Gissa förnamnet" required><button>Svara</button></form><button id="next-letter" class="hidden" type="button">Visa första bokstaven</button><button id="restart" class="hidden" type="button">Testa igen</button><p class="note">Prototyp med exempelpersonen Stefan. Ingen deltagardata används och inga poäng sparas. Testa både rätt och fel svar.</p></div></main>
<script>
(()=>{'use strict';const target='Stefan',el=id=>document.getElementById(id),form=el('form'),answer=el('answer'),portrait=el('portrait'),prompt=el('prompt'),name=el('name'),result=el('result'),next=el('next-letter'),restart=el('restart'),confetti=el('confetti');let count=0,correct=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate(){if(reduced)return;confetti.replaceChildren();const colors=['#facc15','#fb7185','#4ade80','#60a5fa','#c084fc','#fff'];for(let i=0;i<70;i++){const p=document.createElement('i'),a=Math.random()*Math.PI*2,d=65+Math.random()*180;p.style.background=colors[i%colors.length];p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+70+'px');p.style.setProperty('--rot',(Math.random()*900-450)+'deg');confetti.append(p)}setTimeout(()=>confetti.replaceChildren(),1600)}
form.addEventListener('submit',e=>{e.preventDefault();if(!answer.value.trim())return;correct=answer.value.trim().toLocaleLowerCase('sv-SE')==='stefan';answer.blur();form.classList.add('hidden');prompt.textContent='Det rätta namnet är...';name.classList.remove('hidden');next.classList.remove('hidden');next.textContent='Visa första bokstaven';count=0});
next.addEventListener('click',()=>{if(count>=target.length)return;count++;name.textContent=target.slice(0,count);if(count<target.length){next.textContent='Nästa bokstav';return}next.classList.add('hidden');prompt.classList.add('hidden');portrait.classList.remove('jump','sway');void portrait.offsetWidth;portrait.classList.add(correct?'jump':'sway');result.classList.remove('hidden');if(correct){result.classList.add('ok');result.textContent='RÄTT! +1 poäng';celebrate()}else{name.classList.add('hidden');result.classList.remove('ok');result.textContent='Det här är '+target+'!'}restart.classList.remove('hidden')});
restart.addEventListener('click',()=>{count=0;answer.value='';name.textContent='';name.classList.add('hidden');result.textContent='';result.className='result hidden';prompt.textContent='Vem är det här?';prompt.classList.remove('hidden');form.classList.remove('hidden');next.classList.add('hidden');restart.classList.add('hidden');portrait.classList.remove('jump','sway');confetti.replaceChildren()});
})();
</script></body></html>
